<!doctype html><meta charset=utf-8><body style="margin:0"><canvas id=c></canvas>
<script src="three.min.js"></script><script src="rig.js"></script>
<script>
const W=512;const cv=document.getElementById('c');cv.width=W;cv.height=W;
const r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:true,preserveDrawingBuffer:true});
r.setSize(W,W,false);r.setClearColor(0,0);r.shadowMap.enabled=true;r.shadowMap.type=THREE.PCFSoftShadowMap;r.outputColorSpace=THREE.SRGBColorSpace;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.12;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,0.1,100);
scene.add(new THREE.HemisphereLight(0xfff6f0,0xe8d6e6,0.85));
const key=new THREE.DirectionalLight(0xfff0e0,2.3);key.position.set(-4,7,7);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=7;key.shadow.camera.bottom=-4;key.shadow.bias=-0.0004;key.shadow.radius=5;key.shadow.normalBias=0.03;scene.add(key);
const rim=new THREE.DirectionalLight(0xdce8ff,1.1);rim.position.set(5,4,-5);scene.add(rim);
const fill=new THREE.DirectionalLight(0xffeef6,0.7);fill.position.set(5,2,6);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.ShadowMaterial({opacity:0.0}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
window.EL=0.2;let cur=null,mdl=null;
// setup(id,opt): 모델 생성. OV=[size,cy,cx]
window.setup=function(id,opt){opt=opt||{};if(cur)scene.remove(cur);cur=new THREE.Group();mdl=window.FRIENDS[id](opt);cur.add(mdl);cur.rotation.y=opt.yaw===undefined?(Math.PI/2-0.8):opt.yaw;scene.add(cur);window.MODEL=mdl;window.CUR=cur;};
window.view=function(){const o=window.OV||[8,1.5,0];const s=o[0]/2,el=window.EL;cam.left=-s;cam.right=s;cam.top=s;cam.bottom=-s;cam.position.set(o[2],o[1]+10*Math.sin(el),10*Math.cos(el));cam.lookAt(o[2],o[1],0);cam.updateProjectionMatrix();};
window.snap=function(){window.view();r.render(scene,cam);return cv.toDataURL('image/png');};
window.frameWalk=function(ph){window.RIG.pose(mdl,window.RIG.walkSpec(mdl.userData.kind,ph));return window.snap();};
window.framePose=function(n){window.RIG.pose(mdl,window.RIG.poseSpec(mdl.userData.kind,n));return window.snap();};
window.setupSleep=function(kind,opt){opt=opt||{};if(cur)scene.remove(cur);cur=new THREE.Group();window.SL=window.RIG.buildSleep(kind,opt);cur.add(window.SL);cur.rotation.y=opt.yaw===undefined?-0.3:opt.yaw;scene.add(cur);window.CUR=cur;};
window.frameSleep=function(ph){window.RIG.sleepPose(window.SL,ph);return window.snap();};
window.anchor=function(){window.view();window.CUR.updateMatrixWorld(true);const P=window.SL.userData.m.userData.P;const b=new THREE.Box3().setFromObject(P.head);const v=new THREE.Vector3((b.min.x+b.max.x)/2,b.max.y,(b.min.z+b.max.z)/2).project(cam);return [(v.x*0.5+0.5)*256,(1-(v.y*0.5+0.5))*256];};
window.ready=true;
</script>
