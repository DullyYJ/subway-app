# 외부 URL 응답을 data/probe 브랜치에 저장(수동 실행; 구조 확인용)
name: Probe URLs
on:
  workflow_dispatch:
    inputs:
      urls:
        description: '줄바꿈으로 구분한 URL'
        required: true
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 받기
        env:
          URLS: ${{ inputs.urls }}
        run: node tools/collect-tt/probe.js
      - name: 올리기
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data-probe
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp tools/collect-tt/out/probe-*.txt /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/* .
          git add -A
          git commit -m "probe ($(date -u +%FT%TZ))"
          git push -f origin HEAD:refs/heads/data/probe
