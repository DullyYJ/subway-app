# 시각표 '달라짐 감시'(매주 월요일 04:10 KST) — 자동 갱신 대상이 아닌 서울 1·2·4~9호선, 인천1·2, 김포를 TAGO 와 대조해 내장 시각표와 벌어지면 이슈로 알린다(바꾸지는 않는다).
#   · 이유: 이 노선들은 TAGO 에 일요일 자료가 없거나(2·7호선), 갈라지는 선로·고리·급행 때문에 TAGO 방향 정보로 방향 힌트를 확실히 만들 수 없다(자세한 건 HANDOFF). 그래서 자동으로 바꾸면 오히려 틀릴 수 있어 '알림'까지만 한다.
#   · 기준선: tools/collect-tt/drift-baseline.json (처음 실행 때 지금의 일치도를 저장, 이후 좋아지면 올림).
name: Watch covered-line timetables
on:
  schedule:
    - cron: '10 19 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: tago-collect   # TAGO 를 오래 두드리는 워크플로끼리는 한 번에 하나만(동시에 돌리면 호출이 막혀 자료가 빈다)
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: tools/collect-tt/out
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: 현재 내장 번들 꺼내기
        run: |
          mkdir -p $OUT
          node tools/collect-tt/extract_embed.js $OUT/base.json
      - name: TAGO 수집(서울 1~9·인천·김포)
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
          COVERED_MODE: '1'
          BUDGET_MIN: '90'
        run: |
          [ -n "$TAGO_KEY" ] || { echo "::error::TAGO_KEY 시크릿이 비어 있습니다"; exit 1; }
          node tools/collect-tt/collect.js
      - name: 대조
        run: |
          node tools/collect-tt/drift.js $OUT/base.json $OUT/raw.json tools/collect-tt/drift-baseline.json $OUT/drift $OUT/report.json
          cat $OUT/drift/drift.md >> "$GITHUB_STEP_SUMMARY"
      - name: 기준선 갱신 커밋
        run: |
          cp $OUT/drift/baseline.json tools/collect-tt/drift-baseline.json
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add tools/collect-tt/drift-baseline.json
          git diff --cached --quiet || git commit -m "data: 시각표 감시 기준선 갱신"
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break || sleep 5; done
      - name: 달라짐이 있으면 이슈로 알림(중복 방지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s $OUT/drift/drift-issues.txt ]; then
            T="시각표 달라짐 감시: 확인 필요"
            if [ -z "$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=50" --jq ".[]|select(.title==\"$T\")|.number")" ]; then
              gh api repos/$GITHUB_REPOSITORY/issues -f title="$T" -f body="$(printf '%s\n\n%s' "$(cat $OUT/drift/drift-issues.txt)" "실행: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")" >/dev/null
            fi
          fi
