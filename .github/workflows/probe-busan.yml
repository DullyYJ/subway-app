name: Probe Busan updown
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/collect-tt/busan-probe.js
      - name: 올리기
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data-busan-probe
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp tools/collect-tt/out/* /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/* .
          git add -A
          git commit -m "busan probe"
          git push -f origin HEAD:refs/heads/data/busan-probe
