name: Apply bus hours

# 저장소의 sql/fill.*.sql 을 D1(subway-db)에 적용한다.
#
# 왜 나눴나 (2026-09-08)
#   data.go.kr 이 깃허브 러너 IP 로의 접속을 막아서(전 도시 timed out)
#   TAGO 조회는 PC 에서 하고, D1 적용만 여기서 한다.
#
# 재시도 (2026-09-13)
#   wrangler 가 import 세션을 연달아 열다 놓치면
#   "Not currently importing anything" 으로 한 파일만 실패한다(8번째에서 발생).
#   파일마다 최대 3번 시도하고, 사이에 텀을 둔다. 끝내 실패한 파일은 모아서 알려준다.
#   UPDATE 문이라 같은 파일을 두 번 실행해도 결과는 같다(멱등).
on:
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 적용 전 상태
        run: |
          ls -la sql/ || { echo "::error::sql/ 폴더가 없습니다"; exit 1; }
          shopt -s nullglob
          files=(sql/fill.*.sql)
          [ ${#files[@]} -gt 0 ] || { echo "::error::sql/fill.*.sql 이 없습니다"; exit 1; }
          echo "파일 ${#files[@]}개"
          npx --yes wrangler@3 d1 execute subway-db --remote --command \
            "SELECT COUNT(*) total, SUM(CASE WHEN start_time IS NOT NULL THEN 1 ELSE 0 END) hours, SUM(CASE WHEN itv_wd IS NOT NULL THEN 1 ELSE 0 END) itv FROM bus_routes"

      - name: D1 에 적용
        run: |
          failed=()
          for f in sql/fill.*.sql; do
            echo "── $f ($(wc -l < "$f") 줄)"
            okflag=0
            for try in 1 2 3; do
              if npx --yes wrangler@3 d1 execute subway-db --remote --file="$f"; then
                okflag=1; break
              fi
              echo "::warning::$f 실패 (시도 $try/3) — 15초 뒤 다시"
              sleep 15
            done
            [ $okflag -eq 1 ] || failed+=("$f")
            sleep 5          # import 세션이 정리될 시간을 준다
          done
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::끝내 실패한 파일: ${failed[*]}"
            echo "  → 이 파일들만 다시 올리거나 워크플로를 한 번 더 돌리세요. UPDATE 라 중복 실행해도 안전합니다."
            exit 1
          fi
          echo "전부 적용 완료"

      - name: 적용 후 상태
        if: always()
        run: |
          npx --yes wrangler@3 d1 execute subway-db --remote --command \
            "SELECT COUNT(*) total, SUM(CASE WHEN start_time IS NOT NULL THEN 1 ELSE 0 END) hours, SUM(CASE WHEN itv_wd IS NOT NULL THEN 1 ELSE 0 END) itv FROM bus_routes"
          npx --yes wrangler@3 d1 execute subway-db --remote --command \
            "SELECT route_no, start_time, end_time, itv_wd FROM bus_routes WHERE city_code='23' AND itv_wd IS NOT NULL LIMIT 5"
