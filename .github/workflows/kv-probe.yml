name: KV permission probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: KV 쓰기/읽기/삭제 권한 확인(임시 키 nt:probe)
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          NS: dc7124fce2d946768165f47fc58d6b7e
        run: |
          set -e
          B="https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$NS"
          H="Authorization: Bearer $CF_API_TOKEN"
          echo "put";    curl -sf -X PUT "$B/values/nt:probe" -H "$H" --data 'probe' >/dev/null || { echo "::error::KV 쓰기 권한 없음"; exit 11; }
          echo "get";    [ "$(curl -sf "$B/values/nt:probe" -H "$H")" = "probe" ] || { echo "::error::KV 읽기 실패"; exit 12; }
          echo "delete"; curl -sf -X DELETE "$B/values/nt:probe" -H "$H" >/dev/null || { echo "::error::KV 삭제 실패"; exit 13; }
          echo ok
