name: Build native shell APK

# 웹이 전혀 없는 순수 네이티브 앱(native-shell 브랜치). 옛 웹 앱 빌드는 archive/ci 에 보관되어 있다.
on:
  push:
    branches: [ native-shell ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file:
          - shell_native.test.js
          - screen_native.test.js
          - tabs_engine.test.js
          - settings_engine.test.js
          - commute_brief.test.js
          - hdr_engine.test.js
          - widget_native.test.js
          - dialog_engine.test.js
          - pvlabel_engine.test.js
          - posfusion_engine.test.js
          - shop_engine.test.js
          - food_engine.test.js
          - map_engine.test.js
          - fav_engine.test.js
          - hcards_engine.test.js
          - ride_start_engine.test.js
          - prefetch_access_live.test.js
          - neighbor_live.test.js
          - rules_engine.test.js
          - scene_native.test.js
          - result_engine.test.js
          - news_engine.test.js
          - board_engine.test.js
          - chat_engine.test.js
          - cchips_engine.test.js
          - cong_engine.test.js
          - aicard_engine.test.js
          - home_engine.test.js
          - rhead_engine.test.js
          - talkcard_engine.test.js
          - write_engine.test.js
          - ride_alert.test.js
          - ride_eta.test.js
          - ride_standby.test.js
          - ride_track.test.js
          - ride_local.test.js
          - map_server_fetch.test.js
          - route_follow.test.js
          - route_view.test.js
          - next_train_live_first.test.js
          - ride_overlay_level.test.js
          - ride_detour.test.js
          - store_sync.test.js
          - chat_longpoll.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Run ${{ matrix.file }}
        run: |
          set +e
          node test/${{ matrix.file }} > /tmp/t.log 2>&1
          rc=$?
          tail -n 80 /tmp/t.log
          if [ $rc -ne 0 ]; then
            # 로그가 길면 실패 줄이 위로 밀려 안 보인다 — 실패한 시험과 이유(컴파일 오류 포함)를 맨 끝에 다시 보인다
            echo "===== 실패 요약 ====="
            grep -a -A6 -E "^  FAIL" /tmp/t.log | head -60
            # 로그를 직접 내려받기 어려우므로 실패 줄을 주석(annotation)으로도 남긴다
            grep -a -A8 -m3 -E "FAIL|Error|error:" /tmp/t.log | tr '\n' ' ' | cut -c1-1800 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $rc

  build:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      GDM_KEYSTORE_B64: ${{ secrets.GDM_KEYSTORE_B64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Bundle Noto Sans KR for native screens
        run: |
          pip install --quiet fonttools
          mkdir -p /tmp/fnt shell-android/app/src/main/assets/fonts
          curl -sS -L --retry 4 --retry-delay 5 -m 300 -o /tmp/fnt/v.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          python3 - <<'PYEOF'
          from fontTools.ttLib import TTFont
          from fontTools.varLib import instancer
          from fontTools import subset
          uni = (list(range(0x20, 0x7f)) + list(range(0xa0, 0x100)) + list(range(0x2000, 0x2070)) + [0x20a9, 0x20ac] + list(range(0x2190, 0x2200))
                 + list(range(0x2460, 0x2500)) + list(range(0x25a0, 0x2600)) + list(range(0x3000, 0x3040)) + list(range(0x3130, 0x3190))
                 + list(range(0xac00, 0xd7a4)) + list(range(0xff00, 0xfff0)))
          for name, w in (("Regular", 400), ("Bold", 700)):
              f = instancer.instantiateVariableFont(TTFont("/tmp/fnt/v.ttf"), {"wght": w}, inplace=False)
              f.save("/tmp/fnt/i.ttf")
              o = subset.Options(); o.layout_features = ["*"]; o.notdef_outline = True; o.hinting = False; o.name_IDs = [1, 2, 3, 4, 6]
              ss = subset.Subsetter(o); ss.populate(unicodes=uni)
              g = TTFont("/tmp/fnt/i.ttf"); ss.subset(g)
              out = "shell-android/app/src/main/assets/fonts/NotoSansKR-" + name + ".ttf"
              g.save(out)
              c = g.getBestCmap()
              assert 0xac00 in c and ord("›") in c and "fvar" not in g, "글꼴 만들기 실패: " + name
              import os
              print(name, os.path.getsize(out), "bytes", len(c), "glyph-codes")
          PYEOF
          ls -la shell-android/app/src/main/assets/fonts

      - name: Build APK (release, shrunk) — falls back to debug if R8 fails
        run: |
          set +e
          gradle -p shell-android assembleRelease --no-daemon --stacktrace > /tmp/gradle.log 2>&1
          rc=$?
          tail -40 /tmp/gradle.log
          if [ $rc -ne 0 ]; then
            # 줄이기(R8)가 실패해도 앱은 나와야 한다 — 원인은 주석으로 남기고 디버그 빌드로 대신한다
            grep -a -A8 -m3 -E "What went wrong|error:" /tmp/gradle.log | tr '\n' ' ' | cut -c1-1500 | while IFS= read -r l; do echo "::warning::release 실패 → debug 로 대신: $l"; done
            gradle -p shell-android assembleDebug --no-daemon --stacktrace > /tmp/gradle2.log 2>&1
            rc=$?
            tail -40 /tmp/gradle2.log
            if [ $rc -ne 0 ]; then
              grep -a -A8 -m3 -E "What went wrong|error:" /tmp/gradle2.log | tr '\n' ' ' | cut -c1-1500 | while IFS= read -r l; do echo "::error::$l"; done
              exit $rc
            fi
          fi
          ls -la shell-android/app/build/outputs/apk/*/*.apk
          echo "APK 크기:" $(du -h shell-android/app/build/outputs/apk/*/*.apk | cut -f1)

      # 구글 플레이에 올리는 파일은 APK 가 아니라 업로드 키로 서명한 AAB 다. 비밀값(GDM_KEYSTORE_B64 등)이 있으면 업로드 키로, 없으면 디버그 키로(시험용) 만든다.
      - name: Decode upload keystore
        if: ${{ env.GDM_KEYSTORE_B64 != '' }}
        run: |
          echo "$GDM_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "GDM_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build release bundle (AAB)
        env:
          GDM_STORE_PASSWORD: ${{ secrets.GDM_STORE_PASSWORD }}
          GDM_KEY_ALIAS: ${{ secrets.GDM_KEY_ALIAS }}
          GDM_KEY_PASSWORD: ${{ secrets.GDM_KEY_PASSWORD }}
        run: gradle -p shell-android bundleRelease --no-daemon

      - name: Check bundle (signing, target SDK, 16 KB page size)
        run: |
          AAB=shell-android/app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          keytool -printcert -jarfile "$AAB" | tee /tmp/cert.txt
          if grep -qi "Android Debug" /tmp/cert.txt; then
            echo "::warning::AAB 가 디버그 키로 서명됨 — 플레이에 올릴 수 없다. 업로드 키 비밀값(GDM_KEYSTORE_B64 등)을 넣고 다시 돌릴 것"
            echo "AAB_SIGNED=debug" >> "$GITHUB_ENV"
          else
            echo "AAB_SIGNED=upload" >> "$GITHUB_ENV"
          fi
          APK=$(ls shell-android/app/build/outputs/apk/*/*.apk | head -1)
          AAPT2=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          "$AAPT2" dump badging "$APK" | grep -E "^package|sdkVersion|targetSdkVersion|native-code" | tee /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt || { echo "::error::targetSdkVersion 이 36 이 아님"; exit 1; }
          # 16 KB 페이지: 플레이는 API 35+ 를 겨냥한 앱의 64비트 네이티브 라이브러리가 16 KB 로 정렬돼 있기를 요구한다(LOAD 구간 정렬 0x4000 이상)
          rm -rf /tmp/libs && mkdir /tmp/libs && unzip -q -o "$APK" 'lib/*' -d /tmp/libs || true
          BAD=0
          for so in $(find /tmp/libs -name '*.so' | sort); do
            AL=$(readelf -lW "$so" | awk '/LOAD/ {print $NF}' | sort -u | tr '\n' ' ')
            echo "$so  LOAD 정렬: $AL"
            for a in $AL; do [ $((a)) -lt 16384 ] && BAD=1; done
          done
          if [ $BAD -eq 1 ]; then echo "::warning::16 KB 정렬이 안 된 네이티브 라이브러리가 있다 — 라이브러리 버전을 올려야 한다(위 목록 참고)"; fi

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: gildongmu-release-aab-${{ env.AAB_SIGNED }}
          path: shell-android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: gildongmu-native
          path: |
            shell-android/app/build/outputs/apk/release/*.apk
            shell-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
