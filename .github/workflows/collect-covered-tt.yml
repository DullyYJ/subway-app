# 서울 1~9·인천·김포 시각표를 TAGO 로 시험 수집(수동 실행) — 지금 번들과 대조해 분기 자동 갱신에 넣어도 되는지 판단하는 용도.
# 결과: data/covered-tt 브랜치(메인·APK 빌드와 무관).
name: Collect covered-line timetables (probe)
on:
  workflow_dispatch:
    inputs:
      budget:
        description: '시간 예산(분)'
        required: false
        default: '60'
      lines:
        description: '쉼표로 구분한 노선(비우면 서울1~9·인천1·2·김포)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: TAGO 시각표 수집
        env:
          TAGO_KEY: ${{ secrets.TAGO_KEY }}
          LINES: ${{ inputs.lines }}
          COVERED_MODE: '1'
        run: |
          [ -n "$TAGO_KEY" ] || { echo "::error::TAGO_KEY 시크릿이 비어 있습니다"; exit 1; }
          BUDGET_MIN=${{ inputs.budget }} node tools/collect-tt/collect.js
      - name: 결과를 data/covered-tt 브랜치에 올림
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan data-covered-tt
          git rm -rf --cached . >/dev/null 2>&1 || true
          mkdir -p /tmp/keep && cp tools/collect-tt/out/*.json /tmp/keep/
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/keep/*.json .
          git add -A
          git commit -m "covered-line timetable raw data ($(date -u +%FT%TZ))"
          git push -f origin HEAD:refs/heads/data/covered-tt
