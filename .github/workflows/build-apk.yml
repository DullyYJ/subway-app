name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # ★ 2026-09-25 (스토어 출시 준비): Play 스토어는 업로드마다 versionCode가
      #   반드시 이전보다 커야 한다. android/ 폴더는 매 빌드 cap add android로
      #   새로 만들어져 커밋 상태로 못 남기니, GitHub Actions가 실행마다 자동으로
      #   붙여주는 run_number(1,2,3,...)를 그대로 쓴다 — 별도 카운터 파일 불필요.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # ★ 2026-09-26 (YJ 제보: "Invalid workflow file" — secrets 를 step 의 if: 에서
      #   바로 쓰면 "Unrecognized named-value: 'secrets'" 로 워크플로 전체가 막힘.
      #   시크릿을 아직 하나도 안 만든 저장소에서 특히 이렇게 걸린다. if: 조건에는
      #   secrets 를 직접 못 쓰므로, job 레벨 env 로 한 번 걸러서(env: 정의는 secrets를
      #   읽을 수 있다) 그 결과(문자열 "true"/"false")만 if: 에서 쓴다.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest'

      - name: Add plugins to package.json & capacitor.config.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies['@capacitor/app'] = '6.0.2';
          pkg.dependencies['@capacitor/local-notifications'] = '6.1.2';
          pkg.dependencies['@capacitor-community/background-geolocation'] = '1.2.26';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('package.json updated');

          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          cfg.plugins = cfg.plugins || {};
          cfg.plugins['LocalNotifications'] = { smallIcon: 'ic_stat_subway', iconColor: '#0066CC' };
          cfg.plugins['BackgroundGeolocation'] = {};
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          console.log('capacitor.config.json updated');
          "

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android
        
      - name: Install native plugins (기지국 보조측위 + 작은 요약 화면 + 배터리 최적화 제외)
        run: |
          python3 - << 'PYEOF'
          import os, shutil

          PKG = "com.dullyyj.subway"
          PKGDIR = os.path.join("android/app/src/main/java", *PKG.split("."))
          os.makedirs(PKGDIR, exist_ok=True)

          # 1) 플러그인 소스 복사
          for src in ["native/CellInfoPlugin.java", "native/PipPlugin.java", "native/PowerPlugin.java"]:
              if not os.path.exists(src):
                  raise SystemExit(src + " 가 없습니다 — 저장소에 올렸는지 확인하세요")
              shutil.copy(src, os.path.join(PKGDIR, os.path.basename(src)))

          # 2) MainActivity 재작성 (cap add android 가 매번 새로 만드므로 통째로 덮어씀)
          MAIN = "\n".join([
              "package " + PKG + ";",
              "",
              "import android.content.res.Configuration;",
              "import android.os.Build;",
              "import android.os.Bundle;",
              "",
              "import com.getcapacitor.BridgeActivity;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "",
              "    @Override",
              "    public void onCreate(Bundle savedInstanceState) {",
              "        registerPlugin(CellInfoPlugin.class);",
              "        registerPlugin(PipPlugin.class);",
              "        registerPlugin(PowerPlugin.class);",
              "        super.onCreate(savedInstanceState);",
              "    }",
              "",
              "    // 2026-09-08: PiP 전환을 여기서 직접 하지 않는다.",
              "    //   제스처 내비게이션에서는 '위로 밀어 홈'이 onUserLeaveHint 를 부르지 않는 기기가 많다.",
              "    //   그래서 PiP 가 뜨다 말다 했다. 반대로 '최근 앱'으로 나갈 때는 불리는 기기가 있어서,",
              "    //   최근 앱 화면이 열리는 도중 PiP 로 바뀌며 태스크가 꼬여 카드가 안 눌렸다.",
              "    //   안드로이드 12+ 는 PipPlugin 이 setAutoEnterEnabled 로 시스템에 맡기고,",
              "    //   8~11 만 여기서 처리한다.",
              "    @Override",
              "    protected void onUserLeaveHint() {",
              "        super.onUserLeaveHint();",
              "        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.N && isInPictureInPictureMode()) return;",
              "        PipPlugin.enterFromLeaveHint(this);",
              "    }",
              "",
              "    // PiP 전환/복귀를 웹뷰에 알린다",
              "    @Override",
              "    public void onPictureInPictureModeChanged(boolean inPip, Configuration newConfig) {",
              "        super.onPictureInPictureModeChanged(inPip, newConfig);",
              '        final String js = inPip ? "window._pipShow && window._pipShow();"',
              '                                : "window._pipHide && window._pipHide();";',
              "        runOnUiThread(new Runnable() {",
              "            @Override public void run() {",
              "                try { getBridge().getWebView().evaluateJavascript(js, null); } catch (Exception ignored) { }",
              "            }",
              "        });",
              "    }",
              "}",
          ])

          main = os.path.join(PKGDIR, "MainActivity.java")
          with open(main, "w", encoding="utf-8") as f:
              f.write(MAIN + "\n")

          print("=== MainActivity.java ===")
          print(open(main, encoding="utf-8").read())
          print("=== 설치된 파일 ===")
          for n in sorted(os.listdir(PKGDIR)):
              print(" ", n)
          PYEOF

      - name: Generate launcher icons & splash
        run: |
          npm install --no-save @capacitor/assets@3 --legacy-peer-deps
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#f0f4f8' \
            --iconBackgroundColorDark '#121214' \
            --splashBackgroundColor '#f0f4f8' \
            --splashBackgroundColorDark '#121214'
          echo "=== 생성된 아이콘 확인 ==="
          ls -R android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true

      - name: Patch background-geolocation build.gradle (AGP 8.2.1 호환)
        run: |
          python3 << 'PYEOF'
          import os

          target = 'node_modules/@capacitor-community/background-geolocation/android/build.gradle'
          if not os.path.exists(target):
              print(f'파일 없음: {target}')
              exit(0)

          with open(target, 'r') as f:
              c = f.read()

          # 1. AGP 버전 통일 (8.0.0 → 8.2.1)
          c = c.replace(
              "classpath 'com.android.tools.build:gradle:8.0.0'",
              "classpath 'com.android.tools.build:gradle:8.2.1'"
          )
          # 2. compileSdkVersion 선언부만 정확히 교체 (hasProperty 참조는 유지)
          c = c.replace(
              "    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 33",
              "    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 33"
          )
          # 3. targetSdkVersion 선언부만 정확히 교체
          c = c.replace(
              "        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 33",
              "        targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 33"
          )
          # 4. lintOptions → lint
          c = c.replace('    lintOptions {', '    lint {')
          # 5. compileOptions 추가 (Java 17)
          if 'compileOptions' not in c:
              c = c.replace(
                  '    lint {\n        abortOnError false\n    }\n}',
                  '    lint {\n        abortOnError false\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}'
              )

          with open(target, 'w') as f:
              f.write(c)

          print('패치 완료!')
          print(c)
          PYEOF

      - name: Create network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          python3 -c "
          # ★ 2026-09-25 (스토어 출시 준비 — cleartext 정리): 코드 전수 조사 결과
          #   앱이 기기에서 직접 http:// 로 여는 주소는 실제로 0개다. ws.bus.go.kr·
          #   apis.data.go.kr 등의 http:// 문자열은 전부 워커 프록시(/tago?url=...)에
          #   실어 보내는 '값'일 뿐이고, 실제 그 주소로의 요청은 워커(서버) 쪽에서
          #   일어난다 — 기기는 언제나 https://...workers.dev 하나만 부른다.
          #   그래서 cleartextTrafficPermitted를 전부 false로 내렸다(안드로이드 기본값과
          #   동일). 도메인 목록은 앱이 실제로 거치는 워커/프록시 주소 기록용으로 남겨둠.
          xml  = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n'
          xml += '<network-security-config>\n'
          xml += '    <base-config cleartextTrafficPermitted=\"false\">\n'
          xml += '        <trust-anchors><certificates src=\"system\"/></trust-anchors>\n'
          xml += '    </base-config>\n'
          xml += '    <domain-config cleartextTrafficPermitted=\"false\">\n'
          for d in ['workers.dev','phg0643.workers.dev','swopenapi.seoul.go.kr',
                    'apis.data.go.kr','tago.go.kr','allorigins.win',
                    'corsproxy.io','codetabs.com','thingproxy.freeboard.io','news.google.com']:
              xml += f'        <domain includeSubdomains=\"true\">{d}</domain>\n'
          xml += '    </domain-config>\n'
          xml += '</network-security-config>\n'
          open('android/app/src/main/res/xml/network_security_config.xml','w').write(xml)
          print('network_security_config.xml 생성 완료 (cleartext 전부 차단)')
          "

      - name: Create notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_subway.xml << 'SVGEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp"
            android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF"
              android:pathData="M12,2C8,2 4,3.5 4,7v10c0,1.1 0.3,2 0.8,2.7L3,21.5L4.5,23l1.8-1.8C7,21.7 8,22 9,22h6c1,0 2-0.3 2.7-0.8L19.5,23L21,21.5l-1.8-1.8C19.7,19 20,18.1 20,17V7C20,3.5 16,2 12,2zM9,18c-0.8,0-1.5-0.7-1.5-1.5S8.2,15 9,15s1.5,0.7 1.5,1.5S9.8,18 9,18zM15,18c-0.8,0-1.5-0.7-1.5-1.5S14.2,15 15,15s1.5,0.7 1.5,1.5S15.8,18 15,18zM18,12H6V7h12v5z"/>
          </vector>
          SVGEOF

      - name: Patch AndroidManifest
        run: |
          M="android/app/src/main/AndroidManifest.xml"

          grep -q "networkSecurityConfig" "$M" || \
            sed -i 's|android:label="@string/app_name"|android:label="@string/app_name" android:networkSecurityConfig="@xml/network_security_config"|' "$M"

          PERMS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_FINE_LOCATION"
            "android.permission.ACCESS_COARSE_LOCATION"
            "android.permission.ACCESS_BACKGROUND_LOCATION"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.FOREGROUND_SERVICE_LOCATION"
            "android.permission.POST_NOTIFICATIONS"
            "android.permission.VIBRATE"
            "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
            # 2026-09-15: 출퇴근 예약 알림이 안 울리던 원인.
            #   안드로이드 12+ 는 정확한 시각 알람에 별도 권한이 필요하고,
            #   재부팅 뒤 예약을 되살리려면 BOOT_COMPLETED 도 있어야 한다.
            "android.permission.SCHEDULE_EXACT_ALARM"
            "android.permission.USE_EXACT_ALARM"
            "android.permission.RECEIVE_BOOT_COMPLETED"
          )
          for PERM in "${PERMS[@]}"; do
            grep -q "$PERM" "$M" || \
              sed -i "/<manifest/a\\    <uses-permission android:name=\"$PERM\"/>" "$M"
          done

          # BackgroundGeolocationService는 플러그인 자체 Manifest에 이미 선언됨
          # 중복 방지를 위해 앱 Manifest에는 추가 안 함

          # ★ 작은 요약 화면(PiP) — 액티비티 속성 추가
          python3 - << 'PYEOF'
          import re
          M = "android/app/src/main/AndroidManifest.xml"
          s = open(M, encoding="utf-8").read()

          if "supportsPictureInPicture" not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:supportsPictureInPicture="true" android:resizeableActivity="true"',
                  1)

          # PiP로 크기가 바뀔 때 액티비티가 다시 만들어지지 않도록
          m = re.search(r'android:configChanges="([^"]*)"', s)
          if m:
              vals = m.group(1).split("|")
              for need in ["screenSize", "smallestScreenSize", "screenLayout"]:
                  if need not in vals:
                      vals.append(need)
              s = s.replace(m.group(0), 'android:configChanges="' + "|".join(vals) + '"', 1)

          open(M, "w", encoding="utf-8").write(s)
          print("PiP 매니페스트 패치 완료")
          PYEOF

          echo "=== 최종 AndroidManifest ==="
          cat "$M"

      - name: Patch app/build.gradle (versionCode 자동증가 + 서명설정)
        run: |
          python3 << 'PYEOF'
          path = 'android/app/build.gradle'
          c = open(path, encoding='utf-8').read()

          # ① versionCode/versionName 하드코딩(1 / "1.0") 제거 → 매 빌드 ANDROID_VERSION_CODE
          #    env로 대체(위 job env가 github.run_number를 넣어준다). 시크릿 없이도
          #    항상 정상 동작(없으면 "1"로 폴백 — 기존과 동일).
          before = '        versionCode 1\n        versionName "1.0"\n'
          after = ('        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")\n'
                   '        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"\n')
          if before not in c:
              raise SystemExit("versionCode/versionName 자리를 못 찾음 — capacitor 템플릿이 바뀌었을 수 있음")
          c = c.replace(before, after)

          # ② release 서명 설정 — ANDROID_KEYSTORE_PATH가 없으면(시크릿 미설정)
          #    signingConfig를 아예 안 붙여서 기존과 똑같이 무서명 release로 빌드된다
          #    (기존 기능 보존). 시크릿을 넣으면 다음 실행부터 자동으로 서명됨.
          before2 = ("    buildTypes {\n        release {\n            minifyEnabled false\n"
                     "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                     "        }\n    }\n")
          after2 = ("    signingConfigs {\n"
                    "        release {\n"
                    '            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")\n'
                    "            if (ksPath) {\n"
                    "                storeFile file(ksPath)\n"
                    '                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                    '                keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
                    '                keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
                    "            }\n"
                    "        }\n"
                    "    }\n"
                    "    buildTypes {\n"
                    "        release {\n"
                    "            minifyEnabled false\n"
                    "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                    '            if (System.getenv("ANDROID_KEYSTORE_PATH")) {\n'
                    "                signingConfig signingConfigs.release\n"
                    "            }\n"
                    "        }\n"
                    "    }\n")
          if before2 not in c:
              raise SystemExit("buildTypes.release 자리를 못 찾음 — capacitor 템플릿이 바뀌었을 수 있음")
          c = c.replace(before2, after2)

          open(path, 'w', encoding='utf-8').write(c)
          print("app/build.gradle 패치 완료")
          print(c)
          PYEOF

      - name: Decode release keystore (시크릿 있을 때만)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug

      - name: List APK output (디버그)
        if: always()
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "APK 없음"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # ★ 2026-09-25: 스토어 업로드용 서명 AAB. ANDROID_KEYSTORE_BASE64 시크릿이
      #   저장소에 없으면 이 단계부터는 전부 건너뛰고(디버그 APK만 나오던 기존 동작
      #   그대로), 시크릿을 넣는 순간 다음 push부터 자동으로 서명된 AAB가 같이 나온다.
      - name: Build Release AAB (서명, 시크릿 있을 때만)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: cd android && ./gradlew bundleRelease

      - name: List AAB output (릴리스)
        if: ${{ always() && env.HAS_KEYSTORE == 'true' }}
        run: find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null || echo "AAB 없음"

      - name: Upload AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: subway-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: warn
