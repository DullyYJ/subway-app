name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # ★ 2026-10-16: Kotlin/Compose 같은 빌드 설정을 고칠 땐 시험 60여 개를 매번 기다릴 필요가 없다 — 수동 실행에서만 시험을 건너뛸 수 있다.
      #   main push 는 늘 시험을 전부 돌린다(이 입력이 없으므로 기본 동작 그대로).
      skip_tests:
        description: '시험을 건너뛰고 APK 만 빌드(빌드 설정 확인용)'
        type: boolean
        default: false

jobs:
  # ★ 2026-10-09: 테스트가 하나라도 깨지면 APK 를 만들지 않는다.
  #   (예전엔 테스트를 작업 환경에서만 돌려서, 깨져도 그대로 APK 가 나왔다.)
  #   파일마다 별도 머신에서 돌린다 — 같은 머신에서 병렬로 돌리면 타이밍이 흔들려 flake 가 난다.
  test:
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        file:
          - bus_not_train.ui.test.js
          - bat_ask.ui.test.js
          - sam_ask.ui.test.js
          - metro_native_data.test.js
          - metro_native_java.test.js
          - widget_native_java.test.js
          - widget_app.ui.test.js
          - share_loc.ui.test.js
          - day_preset_shop_wx.ui.test.js
          - cong_card.ui.test.js
          - cong_scene.ui.test.js
          - scene_engine.test.js
          - scene_native_java.test.js
          - scene_native_js.ui.test.js
          - htl_native_js.ui.test.js
          - transfer_row.ui.test.js
          - keyboard_pan.test.js
          - row_native.test.js
          - htl_native.test.js
          - screen_native.test.js
          - screen_native_js.ui.test.js
          - shop_engine.test.js
          - settings_engine.test.js
          - screen_set_js.ui.test.js
          - food_engine.test.js
          - screen_food_js.ui.test.js
          - news_engine.test.js
          - screen_news_js.ui.test.js
          - tabs_engine.test.js
          - board_engine.test.js
          - chat_engine.test.js
          - screen_bct_js.ui.test.js
          - route_row.ui.test.js
          - overlay_pill_native.test.js
          - overlay_reco.ui.test.js
          - overlay_test_buttons.ui.test.js
          - metro_native_js.ui.test.js
          - bus_poll_gap.test.js
          - cell_hop_lead.ui.test.js
          - cell_sync.ui.test.js
          - chat_line_tabs.ui.test.js
          - journey_alerts.ui.test.js
          - loading_chars.ui.test.js
          - arrival_end.ui.test.js
          - loc_disclosure.ui.test.js
          - journey_e2e.ui.test.js
          - latent_refs.ui.test.js
          - next_train_app.ui.test.js
          - next_train_attach.ui.test.js
          - next_train_late.test.js
          - next_train_parity.ui.test.js
          - next_train_timetable.test.js
          - station_timetable.ui.test.js
          - timetable_theme_swipe_play.ui.test.js
          - ovl_ask.ui.test.js
          - bg_fix_time.ui.test.js
          - ride_vehicle_app.ui.test.js
          - bus_pick_flow.ui.test.js
          - timetable_coverage.ui.test.js
          - overlay_stale.ui.test.js
          - holidays.test.js
          - holidays_decide.test.js
          - ride_eta.test.js
          - ride_evidence.ui.test.js
          - ride_track.test.js
          - ride_track.ui.test.js
          - ride_standby.test.js
          - sim/standby_sim.js
          - ovl_standby.ui.test.js
          - standby_card.ui.test.js
          - rt_arrival_cands.ui.test.js
          - shop_version.ui.test.js
          - tabs_smoke.ui.test.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium + Korean fonts
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk

      - name: Run ${{ matrix.file }}
        run: |
          set +e
          node test/${{ matrix.file }} 2>&1 | tee test-run.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            # 실패한 항목을 주석(annotation)으로도 남긴다 — 로그 전체를 못 내려받는 환경에서도 원인을 읽을 수 있게
            grep -E -A2 "FAIL|Error|통과 / [1-9]" test-run.log | head -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
          fi
          exit $RC

  build:
    needs: test
    if: ${{ !cancelled() && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      # ★ 2026-09-25 (스토어 출시 준비): Play 스토어는 업로드마다 versionCode가
      #   반드시 이전보다 커야 한다. android/ 폴더는 매 빌드 cap add android로
      #   새로 만들어져 커밋 상태로 못 남기니, GitHub Actions가 실행마다 자동으로
      #   붙여주는 run_number(1,2,3,...)를 그대로 쓴다 — 별도 카운터 파일 불필요.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # ★ 2026-09-26 (YJ 제보: "Invalid workflow file" — secrets 를 step 의 if: 에서
      #   바로 쓰면 "Unrecognized named-value: 'secrets'" 로 워크플로 전체가 막힘.
      #   시크릿을 아직 하나도 안 만든 저장소에서 특히 이렇게 걸린다. if: 조건에는
      #   secrets 를 직접 못 쓰므로, job 레벨 env 로 한 번 걸러서(env: 정의는 secrets를
      #   읽을 수 있다) 그 결과(문자열 "true"/"false")만 if: 에서 쓴다.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'cmdline-tools;latest'

      - name: Add plugins to package.json & capacitor.config.json
        run: |
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.dependencies['@capacitor/app'] = '6.0.2';
          pkg.dependencies['@capacitor/local-notifications'] = '6.1.2';
          pkg.dependencies['@capacitor-community/background-geolocation'] = '1.2.26';
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          console.log('package.json updated');

          const cfg = JSON.parse(fs.readFileSync('capacitor.config.json','utf8'));
          cfg.plugins = cfg.plugins || {};
          cfg.plugins['LocalNotifications'] = { smallIcon: 'ic_stat_subway', iconColor: '#0066CC' };
          cfg.plugins['BackgroundGeolocation'] = {};
          fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));
          console.log('capacitor.config.json updated');
          "

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: 네이티브 노선도 데이터가 앱에 들어갔는지 확인
        run: |
          test -s android/app/src/main/assets/public/metro_native.bin || { echo "metro_native.bin 이 assets 에 없다 — 네이티브 노선도가 못 뜬다"; exit 1; }
          ls -l android/app/src/main/assets/public/metro_native.bin
        
      - name: Install native plugins (기지국 보조측위 + 배터리 최적화 제외 + 다른 앱 위 표시 + 움직임 감지 + 네이티브 노선도)
        run: |
          python3 - << 'PYEOF'
          import os, shutil

          PKG = "com.dullyyj.subway"
          PKGDIR = os.path.join("android/app/src/main/java", *PKG.split("."))
          os.makedirs(PKGDIR, exist_ok=True)

          # 1) 플러그인 소스 복사
          for src in ["native/CellInfoPlugin.java", "native/PowerPlugin.java", "native/OverlayPlugin.java", "native/MotionPlugin.java", "native/KeepAliveService.java",
                      "native/MetroMapData.java", "native/MetroCamera.java", "native/MetroRenderer.java", "native/MetroMapView.java", "native/NativeMapPlugin.java",
                      # 2026-10-15: 캐릭터 시계 위젯(가로·세로 × 블랙·화이트)
                      "native/WidgetGeo.java", "native/WidgetSim.java", "native/WidgetArt.java", "native/WidgetCore.java",
                      "native/GdmWidgetBase.java", "native/GdmWidgetHB.java", "native/GdmWidgetHW.java", "native/GdmWidgetVB.java", "native/GdmWidgetVW.java",
                      "native/GdmWidgetReceiver.java", "native/GdmWidgetPlugin.java",
                      # 2026-10-15: 내 위치·도착 예정 공유(카카오톡)
                      "native/GdmSharePlugin.java",
                      # 2026-10-16: 네이티브 장면(Kotlin/Compose Canvas + 햅틱) — 순수 자바 코어(Scene*) + 안드로이드 계층 + 코틀린 막
                      "native/SceneCv.java", "native/SceneUtil.java", "native/SceneModel.java", "native/SceneArt.java", "native/SceneCore.java", "native/SceneActs.java",
                      "native/SceneHaptics.java", "native/AndroidCv.java", "native/SceneDriver.java", "native/SceneHost.java", "native/SceneNativePlugin.java",
                      "native/SceneCompose.kt",
                      # 2026-10-16: 경로 카드 버튼 줄(탑승·환승·도착) 전환 연출
                      "native/RowCore.java", "native/RowOverlayView.java", "native/RowNativePlugin.java",
                      # 2026-10-17: 홈 경로 화면 가로 타임라인 네이티브(점진 이전 P1)
                      "native/HtlCore.java", "native/HtlView.java", "native/HtlNativePlugin.java",
                      # 2026-10-18: 서버 구동 네이티브 화면(엔진이 화면 구성까지 내려줌) 1호 — 쇼핑
                      "native/ScreenCore.java", "native/ScreenView.java", "native/ScreenNativePlugin.java"]:
              if not os.path.exists(src):
                  raise SystemExit(src + " 가 없습니다 — 저장소에 올렸는지 확인하세요")
              shutil.copy(src, os.path.join(PKGDIR, os.path.basename(src)))

          # 1-b) 위젯 리소스(레이아웃·위젯 정의·배경 그림·문구) — cap add android 가 만든 res 위에 덮어 복사
          RES_SRC = "native/res"
          RES_DST = "android/app/src/main/res"
          if not os.path.isdir(RES_SRC):
              raise SystemExit(RES_SRC + " 가 없습니다 — 위젯 리소스를 저장소에 올렸는지 확인하세요")
          for root, dirs, files in os.walk(RES_SRC):
              rel = os.path.relpath(root, RES_SRC)
              os.makedirs(os.path.join(RES_DST, rel), exist_ok=True)
              for fn in files:
                  shutil.copy(os.path.join(root, fn), os.path.join(RES_DST, rel, fn))

          # 2) MainActivity 재작성 (cap add android 가 매번 새로 만드므로 통째로 덮어씀)
          MAIN = "\n".join([
              "package " + PKG + ";",
              "",
              "import android.content.Intent;",
              "import android.os.Bundle;",
              "import android.view.MotionEvent;",
              "",
              "import com.getcapacitor.BridgeActivity;",
              "",
              "public class MainActivity extends BridgeActivity {",
              "",
              "    @Override",
              "    public void onCreate(Bundle savedInstanceState) {",
              "        registerPlugin(CellInfoPlugin.class);",
              "        registerPlugin(PowerPlugin.class);",
              "        registerPlugin(OverlayPlugin.class);",
              "        registerPlugin(MotionPlugin.class);",
              "        registerPlugin(NativeMapPlugin.class);",
              "        registerPlugin(SceneNativePlugin.class);",
              "        registerPlugin(RowNativePlugin.class);",
              "        registerPlugin(HtlNativePlugin.class);",
              "        registerPlugin(ScreenNativePlugin.class);",
              "        registerPlugin(GdmWidgetPlugin.class);",
              "        registerPlugin(GdmSharePlugin.class);",
              "        super.onCreate(savedInstanceState);",
              "        WidgetCore.captureLaunch(getIntent());",
              "    }",
              "",
              "    // 네이티브 장면: 캐릭터를 꾹 눌러 집어 끄는 동안은 장면이 손가락을 가져간다(웹뷰 스크롤이 엉키지 않게). 그 밖엔 늘 웹뷰가 받는다.",
              "    @Override",
              "    public boolean dispatchTouchEvent(MotionEvent ev) {",
              "        if (SceneNativePlugin.route(ev)) return true;",
              "        return super.dispatchTouchEvent(ev);",
              "    }",
              "",
              "    @Override",
              "    public void onStop() {",
              "        super.onStop();",
              "        WidgetCore.onAppLeft(this);",
              "    }",
              "",
              "    @Override",
              "    protected void onNewIntent(Intent intent) {",
              "        super.onNewIntent(intent);",
              "        WidgetCore.captureLaunch(intent);",
              "        try { getBridge().triggerWindowJSEvent(\"gdmWidgetGo\", \"{}\"); } catch (Exception e) { }",
              "    }",
              "",
              "}",
          ])

          main = os.path.join(PKGDIR, "MainActivity.java")
          with open(main, "w", encoding="utf-8") as f:
              f.write(MAIN + "\n")

          print("=== MainActivity.java ===")
          print(open(main, encoding="utf-8").read())
          print("=== 설치된 파일 ===")
          for n in sorted(os.listdir(PKGDIR)):
              print(" ", n)
          PYEOF

      # 2026-10-18: 네이티브 화면 글꼴 — 웹이 쓰는 Noto Sans KR 을 앱에도 넣는다(기기 기본 글꼴은 한글이 작아 보임).
      #   구글 폰트 저장소의 가변 글꼴을 받아 보통(400)·굵게(700) 두 개로 뽑고, 한글 11172자·영문·기호만 남겨 줄인다(각 약 2.5MB).
      - name: Bundle Noto Sans KR for native screens
        run: |
          pip install --quiet fonttools
          mkdir -p /tmp/fnt android/app/src/main/assets/fonts
          curl -sS -L --retry 4 --retry-delay 5 -m 300 -o /tmp/fnt/v.ttf "https://raw.githubusercontent.com/google/fonts/main/ofl/notosanskr/NotoSansKR%5Bwght%5D.ttf"
          python3 - <<'PYEOF'
          from fontTools.ttLib import TTFont
          from fontTools.varLib import instancer
          from fontTools import subset
          uni = (list(range(0x20, 0x7f)) + list(range(0xa0, 0x100)) + list(range(0x2000, 0x2070)) + [0x20a9, 0x20ac] + list(range(0x2190, 0x2200))
                 + list(range(0x2460, 0x2500)) + list(range(0x25a0, 0x2600)) + list(range(0x3000, 0x3040)) + list(range(0x3130, 0x3190))
                 + list(range(0xac00, 0xd7a4)) + list(range(0xff00, 0xfff0)))
          for name, w in (("Regular", 400), ("Bold", 700)):
              f = instancer.instantiateVariableFont(TTFont("/tmp/fnt/v.ttf"), {"wght": w}, inplace=False)
              f.save("/tmp/fnt/i.ttf")
              o = subset.Options(); o.layout_features = ["*"]; o.notdef_outline = True; o.hinting = False; o.name_IDs = [1, 2, 3, 4, 6]
              ss = subset.Subsetter(o); ss.populate(unicodes=uni)
              g = TTFont("/tmp/fnt/i.ttf"); ss.subset(g)
              out = "android/app/src/main/assets/fonts/NotoSansKR-" + name + ".ttf"
              g.save(out)
              c = g.getBestCmap()
              assert 0xac00 in c and ord("\u203a") in c and "fvar" not in g, "글꼴 만들기 실패: " + name
              import os
              print(name, os.path.getsize(out), "bytes", len(c), "glyph-codes")
          PYEOF
          ls -la android/app/src/main/assets/fonts

      - name: Generate launcher icons & splash
        run: |
          npm install --no-save @capacitor/assets@3 --legacy-peer-deps
          npx @capacitor/assets generate \
            --android \
            --iconBackgroundColor '#f0f4f8' \
            --iconBackgroundColorDark '#121214' \
            --splashBackgroundColor '#f0f4f8' \
            --splashBackgroundColorDark '#121214'
          echo "=== 생성된 아이콘 확인 ==="
          ls -R android/app/src/main/res/mipmap-anydpi-v26 2>/dev/null || true

      - name: Patch background-geolocation build.gradle (AGP 8.2.1 호환)
        run: |
          python3 << 'PYEOF'
          import os

          target = 'node_modules/@capacitor-community/background-geolocation/android/build.gradle'
          if not os.path.exists(target):
              print(f'파일 없음: {target}')
              exit(0)

          with open(target, 'r') as f:
              c = f.read()

          # 1. AGP 버전 통일 (8.0.0 → 8.2.1)
          c = c.replace(
              "classpath 'com.android.tools.build:gradle:8.0.0'",
              "classpath 'com.android.tools.build:gradle:8.2.1'"
          )
          # 2. compileSdkVersion 선언부만 정확히 교체 (hasProperty 참조는 유지)
          c = c.replace(
              "    compileSdkVersion project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 33",
              "    compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 33"
          )
          # 3. targetSdkVersion 선언부만 정확히 교체
          c = c.replace(
              "        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 33",
              "        targetSdk project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 33"
          )
          # 4. lintOptions → lint
          c = c.replace('    lintOptions {', '    lint {')
          # 5. compileOptions 추가 (Java 17)
          if 'compileOptions' not in c:
              c = c.replace(
                  '    lint {\n        abortOnError false\n    }\n}',
                  '    lint {\n        abortOnError false\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_17\n        targetCompatibility JavaVersion.VERSION_17\n    }\n}'
              )

          with open(target, 'w') as f:
              f.write(c)

          print('패치 완료!')
          print(c)
          PYEOF

      - name: Create network security config
        run: |
          mkdir -p android/app/src/main/res/xml
          python3 -c "
          # ★ 2026-09-25 (스토어 출시 준비 — cleartext 정리): 코드 전수 조사 결과
          #   앱이 기기에서 직접 http:// 로 여는 주소는 실제로 0개다. ws.bus.go.kr·
          #   apis.data.go.kr 등의 http:// 문자열은 전부 워커 프록시(/tago?url=...)에
          #   실어 보내는 '값'일 뿐이고, 실제 그 주소로의 요청은 워커(서버) 쪽에서
          #   일어난다 — 기기는 언제나 https://...workers.dev 하나만 부른다.
          #   그래서 cleartextTrafficPermitted를 전부 false로 내렸다(안드로이드 기본값과
          #   동일). 도메인 목록은 앱이 실제로 거치는 워커/프록시 주소 기록용으로 남겨둠.
          xml  = '<?xml version=\"1.0\" encoding=\"utf-8\"?>\n'
          xml += '<network-security-config>\n'
          xml += '    <base-config cleartextTrafficPermitted=\"false\">\n'
          xml += '        <trust-anchors><certificates src=\"system\"/></trust-anchors>\n'
          xml += '    </base-config>\n'
          xml += '    <domain-config cleartextTrafficPermitted=\"false\">\n'
          for d in ['workers.dev','phg0643.workers.dev','swopenapi.seoul.go.kr',
                    'apis.data.go.kr','tago.go.kr','allorigins.win',
                    'corsproxy.io','codetabs.com','thingproxy.freeboard.io','news.google.com']:
              xml += f'        <domain includeSubdomains=\"true\">{d}</domain>\n'
          xml += '    </domain-config>\n'
          xml += '</network-security-config>\n'
          open('android/app/src/main/res/xml/network_security_config.xml','w').write(xml)
          print('network_security_config.xml 생성 완료 (cleartext 전부 차단)')
          "

      - name: Create notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_subway.xml << 'SVGEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="24dp" android:height="24dp"
            android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#FFFFFF"
              android:pathData="M12,2C8,2 4,3.5 4,7v10c0,1.1 0.3,2 0.8,2.7L3,21.5L4.5,23l1.8-1.8C7,21.7 8,22 9,22h6c1,0 2-0.3 2.7-0.8L19.5,23L21,21.5l-1.8-1.8C19.7,19 20,18.1 20,17V7C20,3.5 16,2 12,2zM9,18c-0.8,0-1.5-0.7-1.5-1.5S8.2,15 9,15s1.5,0.7 1.5,1.5S9.8,18 9,18zM15,18c-0.8,0-1.5-0.7-1.5-1.5S14.2,15 15,15s1.5,0.7 1.5,1.5S15.8,18 15,18zM18,12H6V7h12v5z"/>
          </vector>
          SVGEOF

      - name: Patch AndroidManifest
        run: |
          M="android/app/src/main/AndroidManifest.xml"

          grep -q "networkSecurityConfig" "$M" || \
            sed -i 's|android:label="@string/app_name"|android:label="@string/app_name" android:networkSecurityConfig="@xml/network_security_config"|' "$M"

          PERMS=(
            "android.permission.INTERNET"
            "android.permission.ACCESS_FINE_LOCATION"
            "android.permission.ACCESS_COARSE_LOCATION"
            "android.permission.ACCESS_BACKGROUND_LOCATION"
            "android.permission.FOREGROUND_SERVICE"
            "android.permission.FOREGROUND_SERVICE_LOCATION"
            "android.permission.POST_NOTIFICATIONS"
            "android.permission.VIBRATE"
            "android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"
            # 2026-09-15: 출퇴근 예약 알림이 안 울리던 원인.
            #   안드로이드 12+ 는 정확한 시각 알람에 별도 권한이 필요하고,
            #   재부팅 뒤 예약을 되살리려면 BOOT_COMPLETED 도 있어야 한다.
            "android.permission.SCHEDULE_EXACT_ALARM"
            "android.permission.USE_EXACT_ALARM"
            "android.permission.RECEIVE_BOOT_COMPLETED"
            # 2026-10-01: 다른 앱 위에 길안내 요약을 띄우는 오버레이(사용자가 설정에서 직접 허용해야 동작)
            "android.permission.SYSTEM_ALERT_WINDOW"
            # 2026-10-12: 여정 중 화면이 꺼져도 오버레이 깨우기 틱(5초)이 멈추지 않게 하는 부분 웨이크락
            "android.permission.WAKE_LOCK"
          )
          for PERM in "${PERMS[@]}"; do
            grep -q "$PERM" "$M" || \
              sed -i "/<manifest/a\\    <uses-permission android:name=\"$PERM\"/>" "$M"
          done

          # BackgroundGeolocationService는 플러그인 자체 Manifest에 이미 선언됨
          # 중복 방지를 위해 앱 Manifest에는 추가 안 함

          # ★ 액티비티 속성 — 접이식(폴드) 화면 크기 변화에 액티비티가 다시 만들어지지 않게 한다.
          #   (2026-10-09: 작은 요약 화면(PiP)은 제거했다 — supportsPictureInPicture 는 더 넣지 않는다)
          python3 - << 'PYEOF'
          import re
          M = "android/app/src/main/AndroidManifest.xml"
          s = open(M, encoding="utf-8").read()

          if "resizeableActivity" not in s:
              s = s.replace(
                  'android:name=".MainActivity"',
                  'android:name=".MainActivity" android:resizeableActivity="true"',
                  1)

          # 창 크기가 바뀔 때(폴드 접기·펴기) 액티비티가 다시 만들어지지 않도록
          m = re.search(r'android:configChanges="([^"]*)"', s)
          if m:
              vals = m.group(1).split("|")
              for need in ["screenSize", "smallestScreenSize", "screenLayout"]:
                  if need not in vals:
                      vals.append(need)
              s = s.replace(m.group(0), 'android:configChanges="' + "|".join(vals) + '"', 1)

          # 2026-10-16 (YJ: "키보드 올라올 때 화면을 축소시키지 마, 키보드만 올라오는 거야"):
          #   Capacitor 기본값 adjustResize 는 키보드가 뜨면 웹뷰 높이를 줄여 화면이 찌그러진다.
          #   adjustPan 은 웹뷰 크기를 그대로 두고 키보드가 위에 덮이며, 입력칸이 가려질 때만 창을 밀어 올린다.
          if "windowSoftInputMode" in s:
              s = re.sub(r'android:windowSoftInputMode="[^"]*"', 'android:windowSoftInputMode="adjustPan"', s, count=1)
          else:
              s = s.replace('android:name=".MainActivity"', 'android:name=".MainActivity" android:windowSoftInputMode="adjustPan"', 1)

          # 2026-10-13: 경로 이동 중 프로세스를 살려 두는 우리 포그라운드 서비스(위치 유형)
          if "KeepAliveService" not in s:
              s = s.replace("</application>",
                  '    <service android:name=".KeepAliveService" android:exported="false" android:foregroundServiceType="location" android:stopWithTask="false" />\n    </application>', 1)

          # 2026-10-15: 캐릭터 시계 위젯 4종(가로·세로 × 블랙·화이트) + 알람·부팅 때 깨우는 수신기
          if "GdmWidgetHB" not in s:
              def prov(cls, label, xml):
                  return ('        <receiver android:name=".' + cls + '" android:exported="true" android:label="' + label + '">\n'
                          '            <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE" /></intent-filter>\n'
                          '            <meta-data android:name="android.appwidget.provider" android:resource="@xml/' + xml + '" />\n'
                          '        </receiver>\n')
              blk = (prov("GdmWidgetHB", "길동무 캐릭터 시계 · 가로 블랙", "gdm_widget_hb")
                     + prov("GdmWidgetHW", "길동무 캐릭터 시계 · 가로 화이트", "gdm_widget_hw")
                     + prov("GdmWidgetVB", "길동무 캐릭터 시계 · 세로 블랙", "gdm_widget_vb")
                     + prov("GdmWidgetVW", "길동무 캐릭터 시계 · 세로 화이트", "gdm_widget_vw")
                     + '        <receiver android:name=".GdmWidgetReceiver" android:exported="false">\n'
                       '            <intent-filter>\n'
                       '                <action android:name="android.intent.action.BOOT_COMPLETED" />\n'
                       '                <action android:name="android.intent.action.TIME_SET" />\n'
                       '                <action android:name="android.intent.action.TIMEZONE_CHANGED" />\n'
                       '                <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />\n'
                       '            </intent-filter>\n'
                       '        </receiver>\n')
              s = s.replace("</application>", blk + "    </application>", 1)

          # 2026-10-15: 내 위치 공유 그림을 카카오톡 등에 읽기로 넘기는 FileProvider(앱 캐시 cache/gdmshare 만)
          if "gdmshare" not in s:
              s = s.replace("</application>",
                  '        <provider android:name="androidx.core.content.FileProvider" android:authorities="${applicationId}.gdmshare" android:exported="false" android:grantUriPermissions="true">\n'
                  '            <meta-data android:name="android.support.FILE_PROVIDER_PATHS" android:resource="@xml/gdm_share_paths" />\n'
                  '        </provider>\n    </application>', 1)

          open(M, "w", encoding="utf-8").write(s)
          print("매니페스트 패치 완료")
          PYEOF

          echo "=== 최종 AndroidManifest ==="
          cat "$M"

      - name: Patch app/build.gradle (versionCode 자동증가 + 서명설정)
        run: |
          python3 << 'PYEOF'
          path = 'android/app/build.gradle'
          c = open(path, encoding='utf-8').read()

          # ① versionCode/versionName 하드코딩(1 / "1.0") 제거 → 매 빌드 ANDROID_VERSION_CODE
          #    env로 대체(위 job env가 github.run_number를 넣어준다). 시크릿 없이도
          #    항상 정상 동작(없으면 "1"로 폴백 — 기존과 동일).
          before = '        versionCode 1\n        versionName "1.0"\n'
          after = ('        versionCode Integer.parseInt(System.getenv("ANDROID_VERSION_CODE") ?: "1")\n'
                   '        versionName System.getenv("ANDROID_VERSION_NAME") ?: "1.0"\n')
          if before not in c:
              raise SystemExit("versionCode/versionName 자리를 못 찾음 — capacitor 템플릿이 바뀌었을 수 있음")
          c = c.replace(before, after)

          # ② release 서명 설정 — ANDROID_KEYSTORE_PATH가 없으면(시크릿 미설정)
          #    signingConfig를 아예 안 붙여서 기존과 똑같이 무서명 release로 빌드된다
          #    (기존 기능 보존). 시크릿을 넣으면 다음 실행부터 자동으로 서명됨.
          before2 = ("    buildTypes {\n        release {\n            minifyEnabled false\n"
                     "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                     "        }\n    }\n")
          after2 = ("    signingConfigs {\n"
                    "        release {\n"
                    '            def ksPath = System.getenv("ANDROID_KEYSTORE_PATH")\n'
                    "            if (ksPath) {\n"
                    "                storeFile file(ksPath)\n"
                    '                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")\n'
                    '                keyAlias System.getenv("ANDROID_KEY_ALIAS")\n'
                    '                keyPassword System.getenv("ANDROID_KEY_PASSWORD")\n'
                    "            }\n"
                    "        }\n"
                    "    }\n"
                    "    buildTypes {\n"
                    "        release {\n"
                    "            minifyEnabled false\n"
                    "            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'\n"
                    '            if (System.getenv("ANDROID_KEYSTORE_PATH")) {\n'
                    "                signingConfig signingConfigs.release\n"
                    "            }\n"
                    "        }\n"
                    "    }\n")
          if before2 not in c:
              raise SystemExit("buildTypes.release 자리를 못 찾음 — capacitor 템플릿이 바뀌었을 수 있음")
          c = c.replace(before2, after2)

          open(path, 'w', encoding='utf-8').write(c)
          print("app/build.gradle 패치 완료")
          print(c)
          PYEOF

      - name: Add Kotlin + Jetpack Compose (네이티브 장면)
        run: |
          python3 native/inject_kotlin_compose.py android
          echo "=== android/build.gradle ==="; cat android/build.gradle
          echo "=== android/app/build.gradle ==="; cat android/app/build.gradle
          echo "=== android/app/capacitor.build.gradle ==="; cat android/app/capacitor.build.gradle || true
          echo "=== android/gradle.properties ==="; cat android/gradle.properties

      - name: Decode release keystore (시크릿 있을 때만)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_PATH=release.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: |
          cd android
          set +e
          ./gradlew assembleDebug 2>&1 | tee ../gradle-build.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            # 실패 원인을 주석(annotation)으로도 남긴다 — 로그 전체를 못 내려받는 환경에서도 읽을 수 있게
            grep -vE "^> Task" ../gradle-build.log | grep -E "error:|\.java:[0-9]+|\.xml:[0-9]+|FAILED|What went wrong|Execution failed|cannot find symbol|AAPT|error: " | head -8 | while IFS= read -r l; do echo "::error::${l:0:400}"; done
          fi
          exit $RC

      - name: List APK output (디버그)
        if: always()
        run: find android/app/build/outputs -name "*.apk" 2>/dev/null || echo "APK 없음"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: subway-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # ★ 2026-09-25: 스토어 업로드용 서명 AAB. ANDROID_KEYSTORE_BASE64 시크릿이
      #   저장소에 없으면 이 단계부터는 전부 건너뛰고(디버그 APK만 나오던 기존 동작
      #   그대로), 시크릿을 넣는 순간 다음 push부터 자동으로 서명된 AAB가 같이 나온다.
      - name: Build Release AAB (서명, 시크릿 있을 때만)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: cd android && ./gradlew bundleRelease

      - name: List AAB output (릴리스)
        if: ${{ always() && env.HAS_KEYSTORE == 'true' }}
        run: find android/app/build/outputs/bundle -name "*.aab" 2>/dev/null || echo "AAB 없음"

      - name: Upload AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: subway-app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 90
          if-no-files-found: warn
